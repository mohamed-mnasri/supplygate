# they are derived from product_id with the internal-use prefix 200 (see gtin.py).
# reference_price_eur is an approximate street price, used only to generate
# plausible synthetic offer prices.
#
# verified: false means the entry has not yet been re-checked against the
# manufacturer's product page. See docs/seed_catalog.md for the checklist.
#
# Units: clocks in MHz, power in W, memory in GB, RAM speed in MT/s.
# Hybrid Intel CPUs: cores = P + E, base clock = P-core base, tdp = processor base power.
# GPUs are reference / Founders Edition specs; brand is the chip vendor.

